name: "Check and Format LaTeX Document"

on:
  push:
    branches:
      - 'docs-**'
    paths:
      - "docs/**/*.tex"
  pull_request:
    branches:
      - 'docs-**'
    types:
      - opened
      - synchronize
    paths:
      - "docs/**/*.tex"

jobs:
  format:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tex-fmt
        run: |
          wget https://github.com/WGUNDERWOOD/tex-fmt/releases/download/v0.5.5/tex-fmt-x86_64-linux.tar.gz
          tar -xzf tex-fmt-x86_64-linux.tar.gz
          sudo mv tex-fmt /usr/local/bin/

      - name: Get changed .tex files
        id: changed-tex-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/*.tex
          diff_relative: true

      - name: Format changed TeX files
        if: steps.changed-tex-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-tex-files.outputs.all_changed_files }}
        run: |
          for file in ${ALL_CHANGED_FILES}; do
            tex-fmt "$file"
          done

      - name: Prepare build matrix
        id: set-matrix
        if: steps.changed-tex-files.outputs.any_changed == 'true'
        run: |
          str-files="${{ steps.changed-tex-files.outputs.all_changed_files }}"
          echo 'files=($str-files)' >> "$GITHUB_OUTPUT"


      # save changes for later jobs
      - name: Upload formatted sources
        if: steps.changed-tex-files.outputs.any_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: formatted-src
          path: .
          retention-days: 1

  build:
    needs: format
    if: ${{ needs.format.outputs.files != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.format.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download formatted sources
        uses: actions/download-artifact@v4
        with:
          name: formatted-src
          path: .
      - name: Build with latex-action
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ matrix.file }}
          TEXINPUTS: "./refs:./docs:"
      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: built-pdfs
          path: docs/**/*.pdf
          retention-days: 90
          overwrite: true

  commit:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download formatted sources
        uses: actions/download-artifact@v4
        with:
          name: formatted-src
          path: .
      - name: Push
        uses: stefanzweifel/git-auto-commit-action@master
        with:
          commit_message: "style: format using tex-fmt"
