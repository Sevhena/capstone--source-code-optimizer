name: "Build LaTeX Documents"

on:
  push:
    branches:
      - main-test
      - main
    paths:
      - "docs/**/*.tex"

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.set-matrix.outputs.files }}
      str-files: ${{ steps.set-matrix.outputs.str-files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed .tex files
        id: changed-tex-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/*.tex
          diff_relative: true

      - name: Prepare build matrix
        id: set-matrix
        if: steps.changed-tex-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-tex-files.outputs.all_changed_files }}
        run: |
          files="${ALL_CHANGED_FILES}"
          echo "$files"
          JSON_ARRAY=$(echo "$files" | jq -R -s -c 'split(" ")')
          echo "files=$JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "str-files=$files" >> $GITHUB_OUTPUT

  build:
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.files != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJSON(needs.prepare-matrix.outputs.files) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build with latex-action
        uses: xu-cheng/latex-action@v4
        with:
          work_in_root_file_dir: true
          root_file: ${{ matrix.file }}

      - name: Set PDF artifact name
        id: set-name
        run: |
          # Extract just the filename without path and extension
          file=$(basename "${{ matrix.file }}")
          filename="${file/.tex/.pdf}"
          echo "artifact_name=$filename" >> $GITHUB_OUTPUT

      - name: Set PDF path
        id: set-pdf-path
        run: |
          tex_file="${{ matrix.file }}"
          pdf_file="${tex_file/.tex/.pdf}"
          echo "pdf_path=$pdf_file" >> $GITHUB_OUTPUT
          echo "PDF will be at: $pdf_file"

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-name.outputs.artifact_name }}
          path: ${{ steps.set-pdf-path.outputs.pdf_path }}
          retention-days: 90
          overwrite: true

  commit:
    needs: [prepare-matrix, build]
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Download all PDF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: downloaded-pdfs
          merge-multiple: true
      
      - name: Move PDFs to correct locations
        env:
          FILES_JSON: ${{ needs.prepare-matrix.outputs.str-files }}
        run: |
          git status
          dir

          # Convert JSON to list of files
          for tex_file in ${FILES_JSON}; do
            base_name=$(basename "$tex_file")
            file_name="${base_name/.tex/.pdf}"
            target_path="${tex_file/.tex/.pdf}"
            source_pdf="downloaded-pdfs/$file_name"
            
            if [ -f "$source_pdf" ]; then
              mv -f "$source_pdf" "$target_path"
              echo "Moved: $source_pdf -> $target_path"
            else
              echo "PDF not found: $source_pdf (for $tex_file)"
            fi
          done
          
          # Clean up the temporary directory
          rm -rf downloaded-pdfs

      - name: Push
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: added built PDFs"
          file_pattern: "docs/**/*.pdf"
