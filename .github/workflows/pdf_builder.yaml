name: "Build LaTeX Documents"

on:
  push:
    branches:
      - main-test
      - main
    paths:
      - "docs/**/*.tex"

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.set-matrix.outputs.files }}
      str-files: ${{ steps.set-matrix.outputs.str-files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed .tex files
        id: changed-tex-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/*.tex
          diff_relative: true

      - name: Prepare build matrix
        id: set-matrix
        if: steps.changed-tex-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-tex-files.outputs.all_changed_files }}
        run: |
          files="${ALL_CHANGED_FILES}"
          echo "$files"
          JSON_ARRAY=$(echo "$files" | jq -R -s -c 'split(" ")')
          echo "files=$JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "str-files=$files" >> $GITHUB_OUTPUT

  build:
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.files != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJSON(needs.prepare-matrix.outputs.files) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build with latex-action
        uses: xu-cheng/latex-action@v4
        with:
          work_in_root_file_dir: true
          root_file: ${{ matrix.file }}

      - name: Set PDF artifact name
        id: set-name
        run: |
          # Extract just the filename without path and extension
          file=$(basename "${{ matrix.file }}")
          filename="${file%.tex}"
          echo "artifact_name=$filename" >> $GITHUB_OUTPUT

      - name: Set PDF path
        id: set-pdf-path
        run: |
          tex_file="${{ matrix.file }}"
          pdf_file="${tex_file/.tex/.pdf}"
          echo "pdf_path=$pdf_file" >> $GITHUB_OUTPUT
          echo "PDF will be at: $pdf_file"

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-name.outputs.artifact_name }}
          path: ${{ steps.set-pdf-path.outputs.pdf_path }}
          retention-days: 90
          overwrite: true

  commit:
    needs: [prepare-matrix, build]
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore all PDFs to correct locations
        env:
          FILES_LIST: ${{ needs.prepare-matrix.outputs.str-files }}
        run: |
          # Convert JSON to list of files
          files="$FILES_LIST"
          echo "Files to restore: $files"
          
          for tex_file in $files; do
            base_name=$(basename "$tex_file" .tex)
            pdf_file="${tex_file%.tex}.pdf"
            
            # Download the specific artifact
            if actions-download-artifact --name "${base_name%.tex}" --path . 2>/dev/null; then
              # The PDF gets downloaded to current directory with its original name
              # Now move it to the correct path
              mv -f "$base_name.pdf" "$pdf_file" 2>/dev/null
              echo "Restored: $pdf_file"
            fi
          done

      - name: Push
        uses: stefanzweifel/git-auto-commit-action@master
        with:
          commit_message: "chore: added built PDFs"
          file_pattern: "docs/**/*.pdf"
